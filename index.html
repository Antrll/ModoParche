<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parchemos - Villavicencio</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #facc15; font-size: 1.8rem; margin: 0; }
        .location { background: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; color: #38bdf8; }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #facc15; }
        .card h3 { margin: 0 0 8px 0; font-size: 1.2rem; }
        .card p { margin: 4px 0; color: #94a3b8; font-size: 0.9rem; }
        .btn-parche { background: #22c55e; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 15px; font-size: 1rem; }
        .btn-parche:hover { background: #16a34a; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Parchemos 🔥</h1>
            <div class="location">📍 Villavicencio</div>
        </header>

        <h2>¿Qué parcheamos hoy?</h2>

        <div class="card">
            <h3>⚽ Fútbol 5 - Canchas El Llano</h3>
            <p>Faltan 2 parceros para armar equipo.</p>
            <p>💰 $12.000 c/u | 🕒 Hoy, 7:00 PM</p>
            <button class="btn-parche">¡Me uno al parche!</button>
        </div>

        <div class="card">
            <h3>🍔 Hamburguesas en el Centro</h3>
            <p>Parche abierto para comer y parchar un rato.</p>
            <p>💰 Presupuesto libre | 🕒 En 30 minutos</p>
            <button class="btn-parche">Open the Parche 🟢</button>
        </div>
    </div>
</body>
</html>
