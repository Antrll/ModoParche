# ModoParche · revisa cada cambio: lint, pruebas (unitarias y SQL/RLS) y compilación
name: CI

on:
  push:
    branches: [main, dashboard-usuarios-supabase, SubidaDavidClaudeWeb]
  pull_request:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Edge Functions de Supabase: tipos (deno check) y comportamiento con un Supabase simulado
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check --config tests/edge/deno.json supabase/functions/*/index.ts
      - run: deno test --config tests/edge/deno.json --allow-env --allow-read --no-check tests/edge/
