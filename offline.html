<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF5A1F">
<meta name="robots" content="noindex">
<title>Sin conexión · ModoParche</title>
<link rel="icon" href="/src/assets/Branding/favicon/favicon.ico">
<script>(function(){var t="sistema";try{t=localStorage.getItem("mp_tema")||"sistema";}catch(e){}var d=t==="oscuro"||(t!=="claro"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.documentElement.classList.add("is-dark");})();</script>
<style>
  @font-face { font-family: 'Gagalin'; src: url('/src/assets/fonts/Gagalin-Regular.woff2') format('woff2'); font-display: swap; }
  :root { --bg: #FF5A1F; --ink: #111; --card: #fff; --muted: #38383f; }
  html.is-dark { --bg: #161618; --ink: #f3f1ec; --card: #202024; --muted: #b9b9c2; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  main { width: min(420px, 100%); display: grid; justify-items: center; gap: 16px; text-align: center; }
  img { width: 120px; height: auto; animation: flota 3s ease-in-out infinite; }
  h1 { font: 400 clamp(2.4rem, 11vw, 3.6rem)/.9 'Gagalin', Impact, sans-serif; text-transform: uppercase; }
  p { max-width: 32ch; color: var(--ink); opacity: .85; }
  .card { width: 100%; padding: 14px 16px; border-radius: 18px; background: var(--card); color: var(--ink); font-size: 15px; text-align: left; }
  .card b { display: block; margin-bottom: 2px; }
  button { min-height: 52px; padding: 0 26px; border: 2px solid var(--ink); border-radius: 999px; background: var(--ink); color: var(--bg); font: 700 16px system-ui, sans-serif; cursor: pointer; }
  button:active { transform: scale(.97); }
  .estado { font-size: 14px; font-weight: 600; min-height: 1.4em; }
  @keyframes flota { 50% { transform: translateY(-8px) rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) { img { animation: none; } }
</style>
</head>
<body>
<main>
  <img src="/src/assets/web/logo-isotipo.webp" alt="" width="397" height="476" onerror="this.remove()">
  <h1>Sin señal</h1>
  <p>No hay internet en este momento. Apenas vuelva la conexión, seguimos donde ibas.</p>
  <div class="card"><b>¿En una emergencia?</b>Llama al 123. Las llamadas funcionan aunque no tengas datos.</div>
  <button type="button" id="r">Reintentar</button>
  <p class="estado" id="e" role="status" aria-live="polite"></p>
</main>
<script>
  var e = document.getElementById('e');
  function volver() { e.textContent = 'Conectando…'; location.reload(); }
  document.getElementById('r').addEventListener('click', function () { navigator.onLine ? volver() : (e.textContent = 'Todavía sin conexión. Revisa el wifi o los datos.'); });
  window.addEventListener('online', volver);
</script>
</body>
</html>
